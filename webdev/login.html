<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход в калькулятор</title>
    <style>
      * { box-sizing: border-box; }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eaa666, #f98058);
      }

      form {
        width: 340px;
        padding: 35px;
        border-radius: 18px;
        background: white;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
      }

      h1 { margin: 0 0 25px; color: #333; font-size: 26px; text-align: center; }
      div { display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }
      label { color: #555; font-weight: bold; }

      input {
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
      }

      input:focus { border-color: #667eea; box-shadow: 0 0 0 3px #667eea33; }

      button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 8px;
        color: white;
        font-size: 16px;
        font-weight: bold;
        background: linear-gradient(135deg, #d8ef82, #6bc73a);
        cursor: pointer;
      }

      button:hover { opacity: 0.85; }
    </style>
  </head>
  <body>
    <form action="login.php" method="post">
      <h1>Вход в калькулятор</h1>
      <div>
        <label for="login">Логин</label>
        <input id="login" name="login" required />
      </div>
      <div>
        <label for="pwd">Пароль</label>
        <input id="pwd" type="password" name="pwd" required />
      </div>
      <button type="submit">Войти</button>
    </form>
  </body>
</html>
